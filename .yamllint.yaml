extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: false
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
  comments:
    min-spaces-from-content: 1
  indentation:
    # package/crds/ is controller-gen output. package/crossplane.yaml uses the
    # upstream Crossplane package-metadata style, where a sequence is not
    # indented under its key. The exclusion previously named package.yaml,
    # which this repo has never had, so the rule fired on our own metadata.
    ignore: [package/crossplane.yaml, package/crds/]
